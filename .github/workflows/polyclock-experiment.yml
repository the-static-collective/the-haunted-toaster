name: POLYCLOCK experimental sequencer
on:
  pull_request:
    paths:
      - "src/full-measure/experiments/polyclock-001.cjs"
      - "src/full-measure/experiments/test-polyclock-001.cjs"
      - ".github/workflows/polyclock-experiment.yml"
permissions:
  contents: read
jobs:
  standalone-experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node src/full-measure/experiments/test-polyclock-001.cjs
