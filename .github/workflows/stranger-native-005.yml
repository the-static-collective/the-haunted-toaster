name: Toaster Stranger Native 005
on:
  push:
    branches:
      - experiment/stranger-native-005
  pull_request:
    paths:
      - src/full-measure/src/bridge/**
      - src/full-measure/scripts/stranger-native.cjs
      - src/full-measure/tests/stranger-native-bridge.test.cjs
permissions:
  contents: read
jobs:
  native-crossing:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          path: toaster
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: the-static-collective/JAR-VIS
          ref: b3c1ffeb77c5362aa735eb60b57dbe1e220ef904
          path: jarvis
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact Toaster production dependencies
        run: npm ci
        working-directory: toaster/src/full-measure
      - name: Check actual original-source import and boundary tests
        env:
          JARVIS_ROOT: ${{ github.workspace }}/jarvis
        run: node --test tests/stranger-native-bridge.test.cjs
        working-directory: toaster/src/full-measure
      - name: Generate local synthetic song and source-owned kept-creature offer
        env:
          JARVIS_ROOT: ${{ github.workspace }}/jarvis
          FIXTURE: ${{ runner.temp }}/ghost-song.wav
          OFFER: ${{ runner.temp }}/ghost-offer.json
        run: |
          node -e 'const t=require("./src/render/tooling.cjs"); t.runProcess(t.resolveFfmpeg(),["-y","-hide_banner","-loglevel","error","-f","lavfi","-i","sine=frequency=137:duration=5:sample_rate=48000","-c:a","pcm_s16le",process.env.FIXTURE]).catch(e=>{console.error(e);process.exitCode=1})'
          node -e 'const {pathToFileURL}=require("node:url");(async()=>{const base=pathToFileURL(process.env.JARVIS_ROOT+"/src/cabaret/slots.mjs");const o=pathToFileURL(process.env.JARVIS_ROOT+"/src/cabaret/toaster-offer.mjs");const {replaySlots}=await import(base);const {createOffer}=await import(o);const q="Can our ghost cowboy make a movie?";const a="Local synthetic answer, not a real event.";const first=replaySlots({question:q,answer:a});require("node:fs").writeFileSync(process.env.OFFER,JSON.stringify(createOffer({question:q,answer:a,intents:[{kind:"KEEP",candidateId:first.family.creatures[0].id}]})))} )().catch(e=>{console.error(e);process.exitCode=1})'
        working-directory: toaster/src/full-measure
      - name: Run actual original Toaster native six-up and explicit native KEEP to MP4
        env:
          JARVIS_ROOT: ${{ github.workspace }}/jarvis
          FIXTURE: ${{ runner.temp }}/ghost-song.wav
          OFFER: ${{ runner.temp }}/ghost-offer.json
          ROOT: ${{ runner.temp }}
        run: |
          node scripts/stranger-native.cjs inspect --jarvis "$JARVIS_ROOT" --offer "$OFFER"
          node scripts/stranger-native.cjs preview --jarvis "$JARVIS_ROOT" --offer "$OFFER" --audio "$FIXTURE" --out "$ROOT/preview"
          node scripts/stranger-native.cjs render --jarvis "$JARVIS_ROOT" --offer "$OFFER" --audio "$FIXTURE" --out "$ROOT/render" --native-keep-index 2 --authorize I_KEEP_THIS_NATIVE_TOASTER_CANDIDATE
          test -s "$ROOT/render/native-kept.mp4"
          node -e 'const x=require(process.env.ROOT+"/render/crossing-receipt.json");if(!x.nativeKeep||!x.rendered||x.sourceRightsVerified||x.permissionToPublish!==false)process.exit(1)'
        working-directory: toaster/src/full-measure
      - uses: actions/upload-artifact@v4
        with:
          name: fictional-stranger-native-toaster-005
          path: |
            ${{ runner.temp }}/preview
            ${{ runner.temp }}/render
          retention-days: 14
