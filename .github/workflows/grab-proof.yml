name: GRAB proof

on:
  push:
    branches:
      - feature/topology-events-grab-v0.1

jobs:
  red-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: cd src/full-measure && node --test tests/topology-events.test.cjs
