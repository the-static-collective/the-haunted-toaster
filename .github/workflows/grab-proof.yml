name: GRAB proof

on:
  push:
    branches:
      - feature/topology-events-grab-v0.1

permissions:
  contents: read
  statuses: write

jobs:
  red-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Focused GRAB contract
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          cd src/full-measure
          node --test tests/topology-events.test.cjs
          rc=$?
          cd ../..
          if [ "$rc" -eq 0 ]; then state=success; description="focused GRAB contract passed"; else state=failure; description="focused GRAB contract failed"; fi
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${state}\",\"context\":\"GRAB proof\",\"description\":\"${description}\"}"
          exit "$rc"
