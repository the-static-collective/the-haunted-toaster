name: Alpha9 recovery patch

on:
  push:
    branches:
      - agent/alpha9-recovery

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/full-measure/package-lock.json

      - name: Install locked dependencies
        run: npm --prefix src/full-measure ci

      - name: Apply alpha.9 recovery patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path("src/full-measure")

          def replace(path, old, new, count=1):
              path = Path(path)
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f"missing patch anchor in {path}: {old[:120]!r}")
              text2 = text.replace(old, new, count)
              path.write_text(text2)

          # Canonical vocabulary grows; old score identifiers keep their meaning.
          replace(
              root / "src/generation/schema.cjs",
              'const TOPOLOGIES = Object.freeze(["linear", "circle", "mirrored-ring", "spiral", "quad-mirror"]);',
              'const TOPOLOGIES = Object.freeze(["linear", "circle", "mirrored-ring", "spiral", "quad-mirror", "elastic-spine", "split-horizon", "cathedral-fan", "echo-tunnel"]);',
          )

          # Raster-4 uses v3 constraint packs while all v1/v2 files remain untouched.
          packs = [
              ("open-field.v1.json", "open-field.v3.json", "open-field-v3"),
              ("porchlight.v2.json", "porchlight.v3.json", "porchlight-v3"),
              ("wire-orchard.v2.json", "wire-orchard.v3.json", "wire-orchard-v3"),
              ("absolute-residual.v2.json", "absolute-residual.v3.json", "absolute-residual-v3"),
          ]
          shape_pack = ["elastic-spine", "split-horizon", "cathedral-fan", "echo-tunnel"]
          for source, target, identity in packs:
              data = json.loads((root / "constraints" / source).read_text())
              data["id"] = identity
              data["topology"]["allowed"] = list(dict.fromkeys(data["topology"]["allowed"] + shape_pack))
              (root / "constraints" / target).write_text(json.dumps(data, indent=2) + "\n")

          # The live appliance opts into raster-4; historical packs and profiles stay addressable.
          session = root / "src/candidate-session.cjs"
          replace(session, 'const openField = require("../constraints/open-field.v1.json");', 'const openField = require("../constraints/open-field.v3.json");')
          replace(session, 'const porchlight = require("../constraints/porchlight.v2.json");', 'const porchlight = require("../constraints/porchlight.v3.json");')
          replace(session, 'const wireOrchard = require("../constraints/wire-orchard.v2.json");', 'const wireOrchard = require("../constraints/wire-orchard.v3.json");')
          replace(session, 'const absoluteResidual = require("../constraints/absolute-residual.v2.json");', 'const absoluteResidual = require("../constraints/absolute-residual.v3.json");')
          replace(session, 'const rendererProfile = require("../profiles/toaster-raster-3.json");', 'const rendererProfile = require("../profiles/toaster-raster-4.json");')

          # Mutation Lattice becomes the final generation wrapper.
          generation_index = root / "src/generation/index.cjs"
          replace(
              generation_index,
              '  ...require("./native-color-generation.cjs"),\n};',
              '  ...require("./native-color-generation.cjs"),\n  ...require("./mutation-lattice-generation.cjs"),\n};',
          )

          # Toast Feel evidence binds both numeric pressure and categorical affinity.
          toast_generation = root / "src/generation/toast-feel-generation.cjs"
          replace(
              toast_generation,
              '''function feelEvidence(feel) {
  const pressureHash = hashCanonical(
    feel.pressure,
    "HauntedToaster-ToastFeelPressure-v1",
  );
  return deepFreeze({
    contractVersion: feel.contractVersion,
    id: feel.id,
    name: feel.name,
    semanticClass: feel.semanticClass,
    pressureHash,
  });
}''',
              '''function feelEvidence(feel) {
  const pressureHash = hashCanonical(
    feel.pressure,
    "HauntedToaster-ToastFeelPressure-v1",
  );
  const affinityHash = hashCanonical(
    feel.affinity,
    "HauntedToaster-ToastFeelAffinity-v1",
  );
  return deepFreeze({
    contractVersion: feel.contractVersion,
    id: feel.id,
    name: feel.name,
    semanticClass: feel.semanticClass,
    pressureHash,
    affinityHash,
  });
}''',
          )
          replace(
              toast_generation,
              'candidate.scoreArtifact.derivation.policy.toastFeel.pressureHash === evidence.pressureHash',
              'candidate.scoreArtifact.derivation.policy.toastFeel.pressureHash === evidence.pressureHash &&\n    candidate.scoreArtifact.derivation.policy.toastFeel.affinityHash === evidence.affinityHash',
          )
          replace(
              toast_generation,
              '''      pressureHash: evidence.pressureHash,
    },''',
              '''      pressureHash: evidence.pressureHash,
      affinityHash: evidence.affinityHash,
    },''',
          )
          replace(
              toast_generation,
              '''    pressureHash: null,
    seedFamilyHash,''',
              '''    pressureHash: null,
    affinityHash: null,
    seedFamilyHash,''',
          )

          # Feel affinity is a selection bias beneath hard coverage law, never a preset override.
          lattice = root / "src/generation/mutation-lattice-generation.cjs"
          replace(
              lattice,
              '''function selectFromPool(pool, constraints, rootSeed, count = 6) {
  const unique = new Map();''',
              '''function affinityMerit(signature, feel) {
  const affinity = feel?.affinity;
  if (!affinity) return 0;
  let score = 0;
  const layers = signature.layers;
  if (affinity.skeleton?.topologies?.includes(layers.skeleton.topology)) score += 12;
  if (affinity.body?.structures?.includes(layers.body.structure)) score += 5;
  if (affinity.body?.dynamics?.includes(layers.body.dynamics)) score += 5;
  if (affinity.frame?.cameras?.includes(layers.frame.camera)) score += 4;
  if (affinity.skin?.materials?.includes(layers.skin.material)) score += 4;
  if (affinity.skin?.palettes?.includes(layers.skin.palette)) score += 4;
  if (affinity.skin?.nativeColor?.includes(layers.skin.nativeColor)) score += 3;
  if (affinity.weather?.atmospheres?.includes(layers.weather.atmosphere)) score += 4;
  if (affinity.time?.temporalDensity?.includes(layers.time.temporalDensity)) score += 4;
  return score;
}

function selectFromPool(pool, constraints, rootSeed, count = 6, toastFeelId = null) {
  const feel = toastFeelId ? getToastFeel(toastFeelId) : null;
  const unique = new Map();''',
          )
          replace(
              lattice,
              '''        if (!usedCross.has(signature.crossLayerSignature)) value += 300;
        const tie = hashCanonical''',
              '''        if (!usedCross.has(signature.crossLayerSignature)) value += 300;
        value += affinityMerit(signature, feel) * 10;
        const tie = hashCanonical''',
          )
          replace(
              lattice,
              '''    options.rootSeed,
    6,
  );''',
              '''    options.rootSeed,
    6,
    options.toastFeelId || null,
  );''',
          )

          # Shape Pack envelope policies are explicit and v3-specific.
          envelope = root / "src/render/field-envelope.cjs"
          replace(
              envelope,
              'if (!["circle", "mirrored-ring", "spiral", "quad-mirror"].includes(topology)) {',
              'if (!["circle", "mirrored-ring", "spiral", "quad-mirror", "elastic-spine", "split-horizon", "cathedral-fan", "echo-tunnel"].includes(topology)) {',
          )
          replace(
              envelope,
              '''  return Object.freeze({
    policy: "bounded-full-height-v1",
    topology,''',
              '''  const shapePolicies = Object.freeze({
    "elastic-spine": "shape-pack-elastic-spine-v1",
    "split-horizon": "shape-pack-split-horizon-v1",
    "cathedral-fan": "shape-pack-cathedral-fan-v1",
    "echo-tunnel": "shape-pack-echo-tunnel-v1",
  });

  return Object.freeze({
    policy: shapePolicies[topology] || "bounded-full-height-v1",
    topology,''',
          )

          # Shape Pack topology compilers and v3 ghost-overlay execution.
          topology = root / "src/render/topology-compilers.cjs"
          replace(
              topology,
              'const { EXPRESSIVE_RENDERER_POLICY } = require("../generation/renderer-policy.cjs");',
              'const { EXPRESSIVE_RENDERER_POLICY, MUTATION_LATTICE_RENDERER_POLICY } = require("../generation/renderer-policy.cjs");',
          )
          replace(
              topology,
              'const PRODUCTION_WAVE_SEAM = /\\[waveAudio\\]showwaves=s=(\\d+)x(\\d+):mode=cline:rate=([0-9.]+):[^;\\n]+\\[wave\\];\\n\\[wave\\]pad=(\\d+):(\\d+):0:(\\d+):color=black@0\\.0\\[waveFull\\]/;',
              'const PRODUCTION_WAVE_SEAM = /\\[waveAudio\\]showwaves=s=(\\d+)x(\\d+):mode=cline:rate=([0-9.]+):[^;\\n]+\\[wave\\];\\n\\[wave\\]pad=(\\d+):(\\d+):0:(\\d+):color=black@0\\.0\\[waveFull\\]/;\nconst SHAPE_PACK_TOPOLOGIES = Object.freeze(["elastic-spine", "split-horizon", "cathedral-fan", "echo-tunnel"]);',
          )
          shape_functions = r'''
function compileElasticSpine(context) {
  const width = context.envelope.envelope.width;
  const height = context.envelope.envelope.height;
  const spineWidth = Math.max(96, Math.floor(width * 0.22));
  const x = Math.floor((width - spineWidth) / 2);
  const filter = scopeFilter(context, {
    width: spineWidth,
    height,
    zoom: quantize(context.zoom * 1.18, 3),
  });
  return {
    replacement: `[waveAudio]${filter},pad=${width}:${height}:${x}:0:color=black@0.0,${finishFilter(context, 0.08 + context.variance * 0.18)}[waveFull]`,
  };
}

function compileSplitHorizon(context) {
  const width = context.envelope.envelope.width;
  const height = context.envelope.envelope.height;
  const halfHeight = Math.max(32, Math.floor(height / 2));
  const stackedHeight = halfHeight * 2;
  const padY = Math.floor((height - stackedHeight) / 2);
  const filter = scopeFilter(context, { width, height: halfHeight, zoom: quantize(context.zoom * 0.96, 3) });
  return {
    replacement: [
      "[waveAudio]asplit=2[shapeHorizonA][shapeHorizonB]",
      `[shapeHorizonA]${filter}[shapeHorizonTop]`,
      `[shapeHorizonB]${filter},vflip[shapeHorizonBottom]`,
      `[shapeHorizonTop][shapeHorizonBottom]vstack=inputs=2,pad=${width}:${height}:0:${padY}:color=black@0.0,${finishFilter(context, 0)}[waveFull]`,
    ].join(";\n"),
  };
}

function compileCathedralFan(context) {
  const width = context.envelope.envelope.width;
  const height = context.envelope.envelope.height;
  const filter = scopeFilter(context, { width, height, mode: "polar", zoom: quantize(context.zoom * 0.9, 3) });
  const angle = quantize(0.08 + context.variance * 0.07, 4);
  return {
    replacement: [
      `[waveAudio]${filter}[shapeFanSource]`,
      "[shapeFanSource]split=3[shapeFanA][shapeFanB][shapeFanC]",
      `[shapeFanB]rotate=${ffmpegNumber(angle)}:ow=iw:oh=ih:c=black@0[shapeFanBr]`,
      `[shapeFanC]rotate=-${ffmpegNumber(angle)}:ow=iw:oh=ih:c=black@0[shapeFanCr]`,
      "[shapeFanA][shapeFanBr]blend=all_mode=screen[shapeFanAB]",
      `[shapeFanAB][shapeFanCr]blend=all_mode=screen,${finishFilter(context, 0.06 + context.variance * 0.12)}[waveFull]`,
    ].join(";\n"),
  };
}

function compileEchoTunnel(context) {
  const width = context.envelope.envelope.width;
  const height = context.envelope.envelope.height;
  const filter = scopeFilter(context, { width, height, zoom: quantize(context.zoom * 0.9, 3) });
  const middleWidth = Math.max(32, Math.floor(width * 0.72));
  const middleHeight = Math.max(32, Math.floor(height * 0.72));
  const innerWidth = Math.max(32, Math.floor(width * 0.48));
  const innerHeight = Math.max(32, Math.floor(height * 0.48));
  return {
    replacement: [
      `[waveAudio]${filter}[shapeTunnelSource]`,
      "[shapeTunnelSource]split=3[shapeTunnelA][shapeTunnelB][shapeTunnelC]",
      `[shapeTunnelB]scale=${middleWidth}:${middleHeight},pad=${width}:${height}:(ow-iw)/2:(oh-ih)/2:color=black@0[shapeTunnelBm]`,
      `[shapeTunnelC]scale=${innerWidth}:${innerHeight},pad=${width}:${height}:(ow-iw)/2:(oh-ih)/2:color=black@0[shapeTunnelCi]`,
      "[shapeTunnelA][shapeTunnelBm]blend=all_mode=screen[shapeTunnelAB]",
      `[shapeTunnelAB][shapeTunnelCi]blend=all_mode=screen,${finishFilter(context, 0.15 + context.variance * 0.25)}[waveFull]`,
    ].join(";\n"),
  };
}

'''
          replace(topology, 'const TOPOLOGY_COMPILERS = Object.freeze({', shape_functions + 'const TOPOLOGY_COMPILERS = Object.freeze({')
          replace(
              topology,
              '''const EXPRESSIVE_TOPOLOGY_COMPILERS = Object.freeze({
  linear: TOPOLOGY_COMPILERS.linear,
  circle: Object.freeze({ id: "circle-v2", compile: compileCircle }),
  "mirrored-ring": Object.freeze({ id: "mirrored-ring-v2", compile: compileMirroredRing }),
  spiral: Object.freeze({ id: "spiral-polar-v2", compile: compileSpiral }),
  "quad-mirror": Object.freeze({ id: "quad-mirror-v2", compile: compileQuadMirror }),
});''',
              '''const EXPRESSIVE_TOPOLOGY_COMPILERS = Object.freeze({
  linear: TOPOLOGY_COMPILERS.linear,
  circle: Object.freeze({ id: "circle-v2", compile: compileCircle }),
  "mirrored-ring": Object.freeze({ id: "mirrored-ring-v2", compile: compileMirroredRing }),
  spiral: Object.freeze({ id: "spiral-polar-v2", compile: compileSpiral }),
  "quad-mirror": Object.freeze({ id: "quad-mirror-v2", compile: compileQuadMirror }),
});

const MUTATION_LATTICE_TOPOLOGY_COMPILERS = Object.freeze({
  ...EXPRESSIVE_TOPOLOGY_COMPILERS,
  "elastic-spine": Object.freeze({ id: "elastic-spine-v3", compile: compileElasticSpine }),
  "split-horizon": Object.freeze({ id: "split-horizon-v3", compile: compileSplitHorizon }),
  "cathedral-fan": Object.freeze({ id: "cathedral-fan-v3", compile: compileCathedralFan }),
  "echo-tunnel": Object.freeze({ id: "echo-tunnel-v3", compile: compileEchoTunnel }),
});''',
          )
          replace(
              topology,
              '''function topologyRegistryForExecution(execution) {
  return execution?.timeline?.rendererPolicy === EXPRESSIVE_RENDERER_POLICY
    ? EXPRESSIVE_TOPOLOGY_COMPILERS
    : TOPOLOGY_COMPILERS;
}''',
              '''function topologyRegistryForExecution(execution) {
  if (execution?.timeline?.rendererPolicy === MUTATION_LATTICE_RENDERER_POLICY) {
    return MUTATION_LATTICE_TOPOLOGY_COMPILERS;
  }
  return execution?.timeline?.rendererPolicy === EXPRESSIVE_RENDERER_POLICY
    ? EXPRESSIVE_TOPOLOGY_COMPILERS
    : TOPOLOGY_COMPILERS;
}''',
          )

          text = topology.read_text()
          match = re.search(r'function compileProductionTopology\(graph, execution\) \{.*?\n\}\n\nmodule\.exports = \{', text, re.S)
          if not match:
              raise SystemExit("could not locate compileProductionTopology block")
          replacement = r'''function replacementForTopology(topology, context, registry) {
  const entry = registry[topology];
  if (!entry) throw new TypeError(`No topology compiler is registered for ${topology}.`);
  if (topology === "linear") return context.match[0];
  return entry.compile(context).replacement;
}

function namespaceReplacement(replacement, prefix, inputLabel, outputLabel) {
  return replacement.replace(/\[([A-Za-z0-9_]+)\]/g, (_match, label) => {
    if (label === "waveAudio") return `[${inputLabel}]`;
    if (label === "waveFull") return `[${outputLabel}]`;
    return `[${prefix}${label}]`;
  });
}

function topologyArcCompilation(context, execution, registry, sourceTopology) {
  const arc = execution?.timeline?.topologyArc;
  if (!arc?.windows?.length) return null;
  const timebase = Number(execution.timeline.timebase) || 1000;
  const splitOutputs = ["arcBaseAudio", ...arc.windows.map((_, index) => `arcGhostAudio${index}`)];
  const filters = [`[waveAudio]asplit=${splitOutputs.length}${splitOutputs.map((label) => `[${label}]`).join("")}`];
  filters.push(namespaceReplacement(
    replacementForTopology(sourceTopology, context, registry),
    "arcBase_",
    "arcBaseAudio",
    "arcBaseVideo",
  ));
  let current = "arcBaseVideo";
  const evidence = [];
  arc.windows.forEach((window, index) => {
    const ghostTopology = window.ghostTopology;
    const ghostEntry = registry[ghostTopology];
    if (!ghostEntry) throw new TypeError(`No v3 ghost topology compiler is registered for ${ghostTopology}.`);
    const ghostVideo = `arcGhostVideo${index}`;
    filters.push(namespaceReplacement(
      replacementForTopology(ghostTopology, context, registry),
      `arcGhost${index}_`,
      `arcGhostAudio${index}`,
      ghostVideo,
    ));
    const start = ffmpegNumber(window.entranceTick / timebase);
    const release = ffmpegNumber(window.releaseTick / timebase);
    const alpha = window.outcome === "succession" ? 0.92 : window.outcome === "scar" ? 0.2 : 0.48;
    const visible = `arcGhostVisible${index}`;
    filters.push(`[${ghostVideo}]colorchannelmixer=aa=${ffmpegNumber(alpha)}[${visible}]`);
    const enable = window.outcome === "dissolve" ? `between(t,${start},${release})` : `gte(t,${start})`;
    const composite = `arcComposite${index}`;
    filters.push(`[${current}][${visible}]overlay=0:0:enable='${enable}':eof_action=pass[${composite}]`);
    current = composite;
    evidence.push(Object.freeze({
      windowSha256: window.windowSha256,
      sourceTopology,
      sourceCompiler: registry[sourceTopology].id,
      ghostTopology,
      ghostCompiler: ghostEntry.id,
      entranceTick: window.entranceTick,
      peakTick: window.peakTick,
      releaseTick: window.releaseTick,
      overlapPolicy: window.overlapPolicy,
      outcome: window.outcome,
      scar: window.scar || null,
    }));
  });
  filters.push(`[${current}]null[waveFull]`);
  return Object.freeze({
    replacement: filters.join(";\n"),
    evidence: Object.freeze({
      policyVersion: arc.policyVersion,
      planSha256: arc.planSha256,
      windowCount: arc.windowCount,
      windows: Object.freeze(evidence),
    }),
  });
}

function compileProductionTopology(graph, execution) {
  const topology = frozenTopology(execution);
  const registry = topologyRegistryForExecution(execution);
  const entry = registry[topology];
  if (!entry) throw new TypeError(`No topology compiler is registered for ${topology}.`);

  const requiresContext = topology !== "linear" || execution?.timeline?.topologyArc?.windows?.length;
  if (!requiresContext) {
    return {
      graph,
      topology,
      topologyCompiler: entry.id,
      fieldEnvelope: null,
      geometry: productionGeometry(graph),
      topologyArc: null,
    };
  }

  const context = topologyContext(graph, execution);
  const arcCompiled = execution?.timeline?.rendererPolicy === MUTATION_LATTICE_RENDERER_POLICY
    ? topologyArcCompilation(context, execution, registry, topology)
    : null;
  const replacement = arcCompiled
    ? arcCompiled.replacement
    : replacementForTopology(topology, context, registry);
  return {
    graph: graph.replace(PRODUCTION_WAVE_SEAM, replacement),
    topology,
    topologyCompiler: entry.id,
    fieldEnvelope: context.envelope,
    geometry: Object.freeze({ width: context.width, height: context.height, fps: context.fps }),
    topologyArc: arcCompiled?.evidence || null,
  };
}

module.exports = {'''
          text = text[:match.start()] + replacement + text[match.end():]
          text = text.replace(
              '  EXPRESSIVE_TOPOLOGY_COMPILERS,\n  PRODUCTION_WAVE_SEAM,',
              '  EXPRESSIVE_TOPOLOGY_COMPILERS,\n  MUTATION_LATTICE_TOPOLOGY_COMPILERS,\n  PRODUCTION_WAVE_SEAM,\n  SHAPE_PACK_TOPOLOGIES,',
              1,
          )
          topology.write_text(text)

          # Timeline compiler accepts v3 and reuses expressive semantic response while exposing arc evidence.
          timeline_filter = root / "src/render/timeline-filter.cjs"
          replace(
              timeline_filter,
              '  EXPRESSIVE_RENDERER_POLICY,\n  LEGACY_RENDERER_POLICY,',
              '  EXPRESSIVE_RENDERER_POLICY,\n  MUTATION_LATTICE_RENDERER_POLICY,\n  LEGACY_RENDERER_POLICY,',
          )
          replace(
              timeline_filter,
              '''    timeline.rendererPolicy !== VISUAL_LANGUAGE_RENDERER_POLICY &&
    timeline.rendererPolicy !== EXPRESSIVE_RENDERER_POLICY''',
              '''    timeline.rendererPolicy !== VISUAL_LANGUAGE_RENDERER_POLICY &&
    timeline.rendererPolicy !== EXPRESSIVE_RENDERER_POLICY &&
    timeline.rendererPolicy !== MUTATION_LATTICE_RENDERER_POLICY''',
          )
          replace(
              timeline_filter,
              'if (rendererPolicy !== EXPRESSIVE_RENDERER_POLICY) {',
              'if (![EXPRESSIVE_RENDERER_POLICY, MUTATION_LATTICE_RENDERER_POLICY].includes(rendererPolicy)) {',
          )
          replace(
              timeline_filter,
              '''  const registry = rendererPolicy === EXPRESSIVE_RENDERER_POLICY
    ? EXPRESSIVE_SEMANTIC_COMPILER_REGISTRIES
    : SEMANTIC_COMPILER_REGISTRIES;''',
              '''  const registry = [EXPRESSIVE_RENDERER_POLICY, MUTATION_LATTICE_RENDERER_POLICY].includes(rendererPolicy)
    ? EXPRESSIVE_SEMANTIC_COMPILER_REGISTRIES
    : SEMANTIC_COMPILER_REGISTRIES;''',
          )
          # Both compile returns record the exact topology-arc compiler evidence.
          text = timeline_filter.read_text()
          text = text.replace(
              '      fieldEnvelope: topologyCompiled.fieldEnvelope,\n      geometry:',
              '      fieldEnvelope: topologyCompiled.fieldEnvelope,\n      topologyArc: topologyCompiled.topologyArc || null,\n      geometry:',
              1,
          )
          text = text.replace(
              '    fieldEnvelope: topologyCompiled.fieldEnvelope,\n    geometry:',
              '    fieldEnvelope: topologyCompiled.fieldEnvelope,\n    topologyArc: topologyCompiled.topologyArc || null,\n    geometry:',
              1,
          )
          timeline_filter.write_text(text)

          # Success and abnormal-exit evidence bind the exact ghost compiler schedule.
          render = root / "src/render/render.cjs"
          replace(
              render,
              '''      fieldEnvelopePolicy: compiledTimeline.fieldEnvelope?.policy || null,
      operators:''',
              '''      fieldEnvelopePolicy: compiledTimeline.fieldEnvelope?.policy || null,
      topologyArc: compiledTimeline.topologyArc || null,
      operators:''',
          )
          PY

      - name: Prove recovered alpha.9 contract
        run: node --test src/full-measure/tests/alpha9-mutation-lattice.test.cjs

      - name: Check source syntax
        run: npm --prefix src/full-measure run check

      - name: Commit recovered execution patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/alpha9-recovery-patch.yml
          git add -A
          git commit -m "feat: recover alpha.9 mutation lattice execution"
          git push origin HEAD:agent/alpha9-recovery
