name: Alpha9 reconcile

on:
  push:
    branches:
      - agent/alpha9-recovery

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/full-measure/package-lock.json

      - name: Apply alpha.9 reconciliation
        run: python3 src/full-measure/scripts/alpha9-reconcile.py

      - name: Install reconciled locked dependencies
        run: npm --prefix src/full-measure ci

      - name: Prove focused alpha.9 and integration contracts
        run: |
          node --test \
            src/full-measure/tests/alpha9-mutation-lattice.test.cjs \
            src/full-measure/tests/alpha8-release-contract.test.cjs \
            src/full-measure/tests/open-field-contract.test.cjs \
            src/full-measure/tests/toast-feels.test.cjs \
            src/full-measure/tests/toast-feel-generation.test.cjs \
            src/full-measure/tests/toast-feel-session.test.cjs \
            src/full-measure/tests/visual-language-v2-compat.test.cjs \
            src/full-measure/tests/ui-witness-build.test.cjs

      - name: Check source syntax
        run: npm --prefix src/full-measure run check

      - name: Commit reconciled tree and remove temporary machinery
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/alpha9-reconcile.yml src/full-measure/scripts/alpha9-reconcile.py
          git add -A
          git commit -m "fix: reconcile alpha.9 active lineage"
          git push origin HEAD:agent/alpha9-recovery
