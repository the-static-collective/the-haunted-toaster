name: BETA package identity sync

on:
  push:
    branches:
      - beta/reconcile-0.0.0

permissions:
  contents: write

jobs:
  sync-package-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta/reconcile-0.0.0
      - name: Synchronize package-lock release identity
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'src/full-measure/package-lock.json';
          const target = '0.0.0-beta.0';
          const lock = JSON.parse(fs.readFileSync(path, 'utf8'));
          lock.version = target;
          lock.packages[''].version = target;
          fs.writeFileSync(path, JSON.stringify(lock, null, 2) + '\n');
          NODE
      - name: Commit synchronized lockfile
        shell: bash
        run: |
          if git diff --quiet -- src/full-measure/package-lock.json; then
            echo 'package-lock already synchronized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/full-measure/package-lock.json
          git commit -m 'chore: synchronize BETA package identity lockfile'
          git push origin HEAD:beta/reconcile-0.0.0
