name: Haunted Toaster proof and package

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: haunted-toaster-${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_DIR: src/full-measure

jobs:
  track0b-patch:
    name: Apply Track 0B branch patch
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 155 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply bounded Listener durability patch
        shell: python
        run: |
          from pathlib import Path

          app_path = Path('src/full-measure/src/renderer/app.js')
          foundry_path = Path('src/full-measure/src/renderer/lyric-foundry-ui.js')
          app = app_path.read_text(encoding='utf-8')
          foundry = foundry_path.read_text(encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count == 0 and new in text:
                  return text
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          old_begin = '''  async function beginAutoSync() {
            if (
              !state.audio ||
              !elements.lyricsInput.value.trim() ||
              state.lyricSummary?.timed
            ) {
              return;
            }
            clearError();
            openSyncDialog();
            const status = await refreshListenerStatus();
            if (status.ready) {
              await runAutoSync();
            } else {
              showSyncView("setup");
            }
          }
          '''
          new_begin = '''  async function beginAutoSync() {
            if (
              !state.audio ||
              !elements.lyricsInput.value.trim() ||
              state.lyricSummary?.timed
            ) {
              return;
            }
            clearError();
            if (state.alignment) {
              openSyncDialog();
              showAlignmentEditor(state.alignment);
              return;
            }
            openSyncDialog();
            const status = await refreshListenerStatus();
            if (status.ready) {
              await runAutoSync();
            } else {
              showSyncView("setup");
            }
          }
          '''
          app = replace_once(app, old_begin, new_begin, 'beginAutoSync')

          old_pick = '''      if (!selected) return;
              await setLyricsValue(selected.content, {
          '''
          new_pick = '''      if (!selected) return;
              state.alignment = null;
              state.selectedCueIndex = null;
              await setLyricsValue(selected.content, {
          '''
          app = replace_once(app, old_pick, new_pick, 'pickLyrics invalidation')

          old_input = '''  elements.lyricsInput.addEventListener("input", () => {
            if (!state.internalLyricUpdate) state.lyricProvenance = null;
            scheduleLyricInspection();
          });
          '''
          new_input = '''  elements.lyricsInput.addEventListener("input", () => {
            if (!state.internalLyricUpdate) {
              state.lyricProvenance = null;
              state.alignment = null;
              state.selectedCueIndex = null;
            }
            scheduleLyricInspection();
          });
          '''
          app = replace_once(app, old_input, new_input, 'manual lyric invalidation')

          old_wire = '''  elements.lyricsAutoSync.addEventListener("click", beginAutoSync);
          '''
          new_wire = '''  elements.lyricsAutoSync.addEventListener("click", beginAutoSync);
            window.addEventListener("haunted-listener-relisten", async () => {
              if (
                !state.audio ||
                state.syncing ||
                !elements.lyricsInput.value.trim() ||
                state.lyricSummary?.timed
              ) {
                return;
              }
              clearError();
              openSyncDialog();
              await runAutoSync();
            });
          '''
          app = replace_once(app, old_wire, new_wire, 'explicit relisten event')

          foundry = replace_once(
              foundry,
              '      listenCloser?.click();\n',
              '      window.dispatchEvent(new CustomEvent("haunted-listener-relisten"));\n',
              'Foundry relisten dispatch',
          )

          app_path.write_text(app, encoding='utf-8')
          foundry_path.write_text(foundry, encoding='utf-8')

      - name: Commit production repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/full-measure/src/renderer/app.js src/full-measure/src/renderer/lyric-foundry-ui.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: preserve Listener draft across close and reopen"
          git push origin HEAD:${GITHUB_HEAD_REF}

  verify:
    name: Verify renderer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/full-measure/package-lock.json

      - name: Install locked dependencies
        run: npm --prefix src/full-measure ci

      - name: Run consolidated application proof
        run: npm run verify

      - name: Audit runtime dependencies
        run: npm --prefix src/full-measure audit --omit=dev --audit-level=high

      - name: Upload smoke proof
        uses: actions/upload-artifact@v4
        with:
          name: haunted-toaster-smoke-proof
          path: src/full-measure/test-artifacts/
          if-no-files-found: error

  ui-witness:
    name: Verify renderer witness
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/full-measure/package-lock.json

      - name: Install locked dependencies
        run: npm --prefix src/full-measure ci

      - name: Install witness browser
        run: npx --prefix src/full-measure playwright install --with-deps chromium

      - name: Build production renderer witness
        run: npm --prefix src/full-measure run witness:build

      - name: Compare canonical witness states
        run: npm --prefix src/full-measure run witness:test

      - name: Upload renderer witness proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haunted-toaster-ui-witness-baselines
          path: |
            src/full-measure/tests/ui-witness-baselines/
            src/full-measure/tests/ui-witness-results/
          if-no-files-found: error

  package-windows:
    name: Build Windows demo
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    needs:
      - verify
      - ui-witness
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/full-measure/package-lock.json

      - name: Install locked dependencies
        run: npm --prefix src/full-measure ci

      - name: Refuse tag/package identity mismatch
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = node -p "require('./src/full-measure/package.json').version"
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Release identity mismatch: tag $env:GITHUB_REF_NAME does not match package $version."
          }
          Write-Host "Release identity agrees: $expectedTag"

      - name: Build unsigned Windows installer and portable app
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload Windows demo
        uses: actions/upload-artifact@v4
        with:
          name: Haunted-Toaster-Windows-${{ github.run_id }}
          path: |
            src/full-measure/release/*.exe
            src/full-measure/release/*.yml
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: Haunted-Toaster-Windows-${{ github.run_id }}
          path: release-assets

      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; uploading/replacing package assets."
            gh release upload "$GITHUB_REF_NAME" \
              release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            echo "Creating release $GITHUB_REF_NAME."
            gh release create "$GITHUB_REF_NAME" \
              release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Haunted Toaster $GITHUB_REF_NAME" \
              --generate-notes \
              --prerelease
          fi
