name: Haunted Toaster proof and package

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: haunted-toaster-${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_DIR: src/full-measure

jobs:
  verify:
    name: Verify renderer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/full-measure/package-lock.json

      - name: Install locked dependencies
        run: npm --prefix src/full-measure ci

      - name: Run consolidated application proof
        run: npm run verify

      - name: Audit runtime dependencies
        run: npm --prefix src/full-measure audit --omit=dev --audit-level=high

      - name: Upload smoke proof
        uses: actions/upload-artifact@v7
        with:
          name: haunted-toaster-smoke-proof
          path: src/full-measure/test-artifacts/
          if-no-files-found: error

  ui-witness:
    name: Verify renderer witness
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/full-measure/package-lock.json

      - name: Install locked dependencies
        run: npm --prefix src/full-measure ci

      - name: Install witness browser
        run: npx --prefix src/full-measure playwright install --with-deps chromium

      - name: Build production renderer witness
        run: npm --prefix src/full-measure run witness:build

      - name: Compare canonical witness states
        run: npm --prefix src/full-measure run witness:test

      - name: Upload renderer witness proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: haunted-toaster-ui-witness-baselines
          path: |
            src/full-measure/tests/ui-witness-baselines/
            src/full-measure/tests/ui-witness-results/
          if-no-files-found: error

  package-windows:
    name: Build Windows demo
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    needs:
      - verify
      - ui-witness
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/full-measure/package-lock.json

      - name: Install locked dependencies
        run: npm --prefix src/full-measure ci

      - name: Refuse tag/package identity mismatch
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = node -p "require('./src/full-measure/package.json').version"
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Release identity mismatch: tag $env:GITHUB_REF_NAME does not match package $version."
          }
          Write-Host "Release identity agrees: $expectedTag"

      - name: Build unsigned Windows installer and portable app
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload Windows demo
        uses: actions/upload-artifact@v7
        with:
          name: Haunted-Toaster-Windows-${{ github.run_id }}
          path: |
            src/full-measure/release/*.exe
            src/full-measure/release/*.yml
          if-no-files-found: error

  verify-package-handoff:
    name: Verify Windows package handoff
    if: github.event_name == 'workflow_dispatch'
    needs: package-windows
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows package
        uses: actions/download-artifact@v8
        with:
          name: Haunted-Toaster-Windows-${{ github.run_id }}
          path: release-assets

      - name: Verify release-shaped package payload
        shell: bash
        run: |
          test -n "$(find release-assets -maxdepth 1 -type f -name '*.exe' -print -quit)"
          test -n "$(find release-assets -maxdepth 1 -type f -name '*.yml' -print -quit)"

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows package
        uses: actions/download-artifact@v8
        with:
          name: Haunted-Toaster-Windows-${{ github.run_id }}
          path: release-assets

      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; uploading/replacing package assets."
            gh release upload "$GITHUB_REF_NAME" \
              release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            echo "Creating release $GITHUB_REF_NAME."
            gh release create "$GITHUB_REF_NAME" \
              release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Haunted Toaster $GITHUB_REF_NAME" \
              --generate-notes \
              --prerelease
          fi
