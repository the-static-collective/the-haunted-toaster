name: WALK A re-port crucible

on:
  pull_request:
    branches:
      - promote/field-spine-from-212
    paths:
      - .github/workflows/walk-a-reporter.yml

permissions:
  contents: write

jobs:
  re-port:
    runs-on: ubuntu-latest
    steps:
      - name: Check out WALK A
        uses: actions/checkout@v7
        with:
          ref: walk/a-foreign-material-current-spine
          fetch-depth: 0

      - name: Re-port foreign material without ancestry promotion
        shell: bash
        run: |
          set -euo pipefail
          BASE=899a920b17019a54dadfb0c6bb321cc6e4cf860b
          DONOR=f4a575db65d1bdb9cc5e7b462c30226660d4b804

          current=/tmp/candidate-session.current
          base=/tmp/candidate-session.base
          donor=/tmp/candidate-session.donor
          merged=/tmp/candidate-session.merged
          cp src/full-measure/src/candidate-session.cjs "$current"
          git show "${BASE}:src/full-measure/src/candidate-session.cjs" > "$base"
          git show "${DONOR}:src/full-measure/src/candidate-session.cjs" > "$donor"
          git merge-file -p "$current" "$base" "$donor" > "$merged"
          mv "$merged" src/full-measure/src/candidate-session.cjs

          python3 - <<'PY'
          from pathlib import Path

          def load(path):
              p = Path(path)
              return p, p.read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          def insert_after(text, anchor, addition, label):
              return replace_once(text, anchor, anchor + addition, label)

          def insert_before(text, anchor, addition, label):
              return replace_once(text, anchor, addition + anchor, label)

          # candidate-preview: preserve cross-lock + Resolution, add material beside them.
          path = "src/full-measure/src/render/candidate-preview.cjs"
          _, text = load(path)
          text = insert_after(
              text,
              '} = require("./haunted-typography-render.cjs");\n',
              'const {\n  createForeignMaterialPlan,\n  ffmpegInputArgsForForeignMaterial,\n} = require("./foreign-material.cjs");\n',
              "preview foreign import",
          )
          text = replace_once(
              text,
              'function candidatePreviewPlan(candidate, typography = null) {',
              'function candidatePreviewPlan(candidate, typography = null, foreignMaterial = null) {',
              "preview plan signature",
          )
          text = insert_after(text, '    typography,\n', '    foreignMaterial,\n', "preview plan material evidence")
          text = insert_before(
              text,
              '      const baseFilter = await buildHauntedFilterGraph({',
              '      const foreignMaterialPlan = createForeignMaterialPlan({\n'
              '        videoBinding: config.video || null,\n'
              '        timeline: candidate.timeline,\n'
              '        analysisDurationSeconds: Number(analysis.duration),\n'
              '      });\n'
              '      const foreignMaterialInputIndex = foreignMaterialPlan\n'
              '        ? imagePath\n'
              '          ? 3\n'
              '          : 2\n'
              '        : null;\n',
              "preview material plan",
          )
          text = insert_after(
              text,
              '        candidate.timeline?.renderConfig?.atmosphereResolutionScale ?? null,\n',
              '      foreignMaterialPlan,\n      foreignMaterialInputIndex,\n',
              "preview material graph inputs",
          )
          text = insert_after(
              text,
              '      baseFilter.typographyEvidence,\n',
              '      baseFilter.foreignMaterialEvidence,\n',
              "preview material evidence handoff",
          )
          text = insert_before(
              text,
              '      args.push(\n        "-filter_complex_script",',
              '      args.push(...ffmpegInputArgsForForeignMaterial(foreignMaterialPlan));\n',
              "preview material ffmpeg input",
          )
          write(path, text)

          # shared graph: Primitive Field -> Atmosphere -> Atmosphere Resolution -> foreign material.
          path = "src/full-measure/src/render/haunted-typography-render.cjs"
          _, text = load(path)
          text = insert_after(
              text,
              '} = require("./atmosphere-resolution-field.cjs");\n',
              'const { applyForeignMaterialToGraph } = require("./foreign-material.cjs");\n',
              "graph foreign import",
          )
          text = insert_after(
              text,
              '  atmosphereResolutionScale = null,\n',
              '  foreignMaterialPlan = null,\n  foreignMaterialInputIndex = null,\n',
              "graph material inputs",
          )
          text = insert_after(
              text,
              '    : atmosphere.evidence;\n',
              '  const foreignMaterial = applyForeignMaterialToGraph({\n'
              '    graph: atmosphereResolution?.graph || atmosphere.graph,\n'
              '    foreignMaterialPlan,\n'
              '    foreignMaterialInputIndex,\n'
              '    width: legacyConfig.width,\n'
              '    height: legacyConfig.height,\n'
              '    fps: legacyConfig.fps,\n'
              '  });\n',
              "graph material compiler",
          )
          text = replace_once(
              text,
              '  return {\n    ...baseFilter,\n    graph: atmosphereResolution?.graph || atmosphere.graph,\n',
              '  return {\n    ...baseFilter,\n    graph: foreignMaterial.graph,\n',
              "graph terminal material result",
          )
          text = insert_after(text, '    atmosphereEvidence,\n', '    foreignMaterialEvidence: foreignMaterial.evidence,\n', "graph material evidence")
          write(path, text)

          # final render: keep TEST 6 + Witness Window evidence and add the accepted material plan.
          path = "src/full-measure/src/render/render.cjs"
          _, text = load(path)
          text = insert_after(
              text,
              '} = require("./haunted-typography-render.cjs");\n',
              'const {\n  createForeignMaterialPlan,\n  ffmpegInputArgsForForeignMaterial,\n} = require("./foreign-material.cjs");\n',
              "render foreign import",
          )
          text = insert_before(
              text,
              'async function safeUnlink(filePath) {',
              'function compactForeignMaterialEvidence(plan, compilerEvidence) {\n'
              '  if (!plan) return null;\n'
              '  return {\n'
              '    sourceSpecimenId: plan.sourceSpecimenId,\n'
              '    sourceSha256: plan.sourceSha256,\n'
              '    clipAnalysisHash: plan.clipAnalysisHash,\n'
              '    assimilationPolicy: structuredClone(plan.assimilationPolicy),\n'
              '    placement: structuredClone(plan.placement),\n'
              '    sampling: structuredClone(plan.sampling),\n'
              '    compiledOperator: compilerEvidence ? structuredClone(compilerEvidence) : null,\n'
              '  };\n'
              '}\n\n',
              "render material receipt helper",
          )
          text = insert_before(
              text,
              '    const sourceHash = await hashFile(audioPath);',
              '    const foreignMaterialPlan =\n'
              '      config.foreignVisualMaterial\n'
              '      || createForeignMaterialPlan({\n'
              '        videoBinding: config.video || null,\n'
              '        timeline: execution.timeline,\n'
              '        analysisDurationSeconds: Number(analysis.duration),\n'
              '      });\n'
              '    const foreignMaterialInputIndex = foreignMaterialPlan\n'
              '      ? imagePath\n'
              '        ? 3\n'
              '        : 2\n'
              '      : null;\n\n',
              "render accepted material plan",
          )
          text = insert_after(
              text,
              '      atmosphereResolutionScale: config.atmosphereResolutionScale ?? null,\n',
              '      foreignMaterialPlan,\n      foreignMaterialInputIndex,\n',
              "render material graph inputs",
          )
          text = insert_after(text, '      atmosphere: baseFilter.atmosphereEvidence,\n', '      foreignMaterial: baseFilter.foreignMaterialEvidence,\n', "render material compiler evidence")
          text = insert_before(
              text,
              '    ffmpegArgs.push(\n      "-filter_complex_script", filterPath,',
              '    ffmpegArgs.push(...ffmpegInputArgsForForeignMaterial(foreignMaterialPlan));\n\n',
              "render material ffmpeg input",
          )
          text = insert_before(
              text,
              '      visualCompiler: filter.visualCompiler,\n',
              '      foreignMaterial: foreignMaterialPlan\n'
              '        ? {\n'
              '            sourcePath: foreignMaterialPlan.sourcePath,\n'
              '            sourceFilename: foreignMaterialPlan.sourceFilename,\n'
              '            sourceSpecimenId: foreignMaterialPlan.sourceSpecimenId,\n'
              '            sourceSha256: foreignMaterialPlan.sourceSha256,\n'
              '            planHash: foreignMaterialPlan.planHash,\n'
              '            clipAnalysisHash: foreignMaterialPlan.clipAnalysisHash,\n'
              '          }\n'
              '        : null,\n',
              "render material failure evidence",
          )
          text = insert_after(
              text,
              '        typography: filter.typographyEvidence,\n',
              '        foreignVisualMaterial: compactForeignMaterialEvidence(\n'
              '          foreignMaterialPlan,\n'
              '          filter.foreignMaterialEvidence,\n'
              '        ),\n',
              "render material receipt evidence",
          )
          text = insert_after(text, '  compactForcedWitnessEvidence,\n', '  compactForeignMaterialEvidence,\n', "render material helper export")
          write(path, text)
          PY

          node --check src/full-measure/src/candidate-session.cjs
          node --check src/full-measure/src/render/candidate-preview.cjs
          node --check src/full-measure/src/render/haunted-typography-render.cjs
          node --check src/full-measure/src/render/render.cjs
          node --check src/full-measure/src/render/foreign-material.cjs
          git diff --check

          grep -q 'crossLockProjectionForScore' src/full-measure/src/render/candidate-preview.cjs
          grep -q 'atmosphereResolutionScale' src/full-measure/src/render/candidate-preview.cjs
          grep -q 'foreignMaterialEvidence' src/full-measure/src/render/candidate-preview.cjs
          grep -q 'applyResolutionFieldToAtmosphereGraph' src/full-measure/src/render/haunted-typography-render.cjs
          grep -q 'graph: atmosphereResolution?.graph || atmosphere.graph' src/full-measure/src/render/haunted-typography-render.cjs
          grep -q 'compactForcedWitnessEvidence' src/full-measure/src/render/render.cjs
          grep -q 'compactForeignMaterialEvidence' src/full-measure/src/render/render.cjs
          grep -q 'witnessWindow' src/full-measure/src/render/render.cjs
          grep -q 'foreignVisualMaterial' src/full-measure/src/candidate-session.cjs

      - name: Prove WALK A focused contract
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix src/full-measure ci
          node --test \
            src/full-measure/tests/foreign-material.test.cjs \
            src/full-measure/tests/video-session.test.cjs

      - name: Commit explicit behavioral re-port
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/full-measure/src/candidate-session.cjs \
            src/full-measure/src/render/candidate-preview.cjs \
            src/full-measure/src/render/haunted-typography-render.cjs \
            src/full-measure/src/render/render.cjs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No production changes were required."
            exit 0
          fi
          git commit -m 'feat: re-port foreign material onto current field spine'
          git push origin HEAD:walk/a-foreign-material-current-spine
