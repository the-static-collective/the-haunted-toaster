name: Alpha9 reviewed UI baseline promotion

on:
  push:
    branches:
      - agent/alpha9-recovery

permissions:
  contents: write

jobs:
  promote-reviewed-baselines:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/full-measure/package-lock.json

      - name: Install locked dependencies
        run: npm --prefix src/full-measure ci

      - name: Install witness browser
        run: npx --prefix src/full-measure playwright install --with-deps chromium

      - name: Build production renderer witness
        run: npm --prefix src/full-measure run witness:build

      - name: Update reviewed snapshots
        run: npx --prefix src/full-measure playwright test --config=src/full-measure/tests/ui-witness.playwright.config.cjs --update-snapshots

      - name: Refuse any unreviewed visual delta surface
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^src/full-measure/tests/ui-witness-baselines/(empty|song-ready|toast-feel|rendering|complete|failure)\.png$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected files changed during reviewed baseline promotion:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          count="$(printf '%s\n' "$changed" | grep -Ec '^src/full-measure/tests/ui-witness-baselines/.*\.png$' || true)"
          if [ "$count" -ne 6 ]; then
            echo "Expected exactly six reviewed baseline PNG changes; found $count." >&2
            exit 1
          fi

      - name: Compare promoted canonical witness states
        run: npm --prefix src/full-measure run witness:test

      - name: Commit only reviewed baseline changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/alpha9-ui-baseline-promote.yml
          git add src/full-measure/tests/ui-witness-baselines/*.png
          git commit -m "test: promote reviewed alpha.9 UI witness"
          git push origin HEAD:agent/alpha9-recovery
