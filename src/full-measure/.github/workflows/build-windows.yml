name: Build Windows alpha

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify source
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Prove a full render
        run: npm run smoke

      - name: Build Windows installer and portable app
        run: npm run dist -- --win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload unsigned alpha
        uses: actions/upload-artifact@v4
        with:
          name: Full-Measure-Windows-${{ github.ref_name }}
          path: |
            release/*.exe
            release/*.yml
          if-no-files-found: error
